name: ad-proxy-fullstack

services:
  ad-proxy-web:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
    image: ad-ldaps-proxy-fullstack:1.0.0
    container_name: ad-proxy-fullstack
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "10636:10636"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    volumes:
      - ./ad_proxy/config.yaml:/app/ad_proxy/config.yaml:ro
      - ./certs:/app/certs:ro
      - ./logs:/app/logs:rw
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/proxy/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - ad-fullstack-net

networks:
  ad-fullstack-net:
    driver: bridge
    name: ad-fullstack-network
